      <stop offset="0" stop-color="#5b21b6" />
      <stop offset="0.4" stop-color="#7c3aed" />
      <stop offset="0.72" stop-color="#a855f7" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="0.6" stop-color="#ec4899" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="150" cy="120" r="300" fill="url(#orb)" />
  <circle cx="1050" cy="540" r="320" fill="url(#orb)" />

  <g transform="translate(90 86)">
