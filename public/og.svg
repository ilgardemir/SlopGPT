    <path d="M38 14l5.8 14.4L58 34l-14.2 5.6L38 54l-5.8-14.4L18 34l14.2-5.6z" fill="#ffffff" />
  </g>
  <text x="186" y="140" font-family="Manrope, Inter, system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1.5">VibeScore<tspan fill="#fde68a">.AI</tspan></text>

  <text x="90" y="288" font-family="Manrope, Inter, system-ui, sans-serif" font-size="88" font-weight="800" fill="#ffffff" letter-spacing="-4">Turn Ideas Into</text>
  <text x="90" y="382" font-family="Manrope, Inter, system-ui, sans-serif" font-size="88" font-weight="800" fill="#fde68a" letter-spacing="-4">Unicorns With AI</text>

  <text x="90" y="452" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#ffffff" fill-opacity="0.82">Four colourful numbers, a strategic roadmap, and one</text>
  <text x="90" y="494" font-family="Inter, system-ui, sans-serif" font-size="30" fill="#ffffff" fill-opacity="0.82">emotionally damaging roast. Free and gratuitously purple.</text>

  <g font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">
